# Production stack for Coolify's Docker Compose build pack. Set this file as the
# "Docker Compose Location" and assign the public domain to the `app` service.
#
# Coolify fills the SERVICE_* variables itself: it generates the database
# password and auth secret once, keeps them between deployments, and derives
# SERVICE_URL_APP from the domain set on `app`. No secret lives in this file.
# See docs/deployment.md.
services:
  app:
    build:
      context: .
      target: runner
    environment:
      # Declares that the app's domain routes to container port 3000.
      - SERVICE_URL_APP_3000
      - DATABASE_URL=postgresql://crm:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/crm
      - BETTER_AUTH_SECRET=${SERVICE_BASE64_64_AUTHSECRET}
      - BETTER_AUTH_URL=${SERVICE_URL_APP}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Applies the committed SQL once per deployment, then exits. The app starts
  # only after it succeeds, so a failed migration never serves a stale schema.
  migrate:
    build:
      context: .
      target: migrator
    environment:
      - DATABASE_URL=postgresql://crm:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/crm
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    exclude_from_hc: true

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=crm
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=crm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
